// Applied only to the generated CI example; release keeps its bundled JavaScript.
android {
  defaultConfig { testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner' }
  testBuildType 'release'
  buildTypes { release { debuggable true; minifyEnabled false } }
  sourceSets { androidTest.java.srcDirs = [file('../../journeys/androidTest')] }
}
dependencies {
  androidTestImplementation 'androidx.test:runner:1.6.2'
  androidTestImplementation 'androidx.test.ext:junit:1.2.1'
  androidTestImplementation 'androidx.core:core-telecom:1.0.1'
  androidTestImplementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.10.2'
}
