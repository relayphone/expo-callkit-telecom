name: v2 iOS

on:
  pull_request:
    branches: [v2]
    paths: ['tools/sdk-evaluation*', '.github/actions/sdk-consumer/**', '.github/workflows/sdk-package.yml', 'ios/**', 'example/client/**', 'src/**', 'plugin/**', 'package.json', 'bun.lock', '.github/workflows/v2-ios.yml']
  push:
    branches: [v2]
    paths: ['tools/sdk-evaluation*', '.github/actions/sdk-consumer/**', '.github/workflows/sdk-package.yml', 'ios/**', 'example/client/**', 'src/**', 'plugin/**', 'package.json', 'bun.lock', '.github/workflows/v2-ios.yml']

permissions:
  contents: read
concurrency:
  group: v2-ios-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  sdk-package:
    uses: ./.github/workflows/sdk-package.yml
  example:
    needs: sdk-package
    runs-on: xcode-27
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.0'
      - uses: actions/setup-node@v6
        with:
          node-version: '26'
      # ios-voip-sdk requires Swift 6.4.
      - run: sudo xcode-select -s /Applications/Xcode_27.1.app
      - uses: ./.github/actions/sdk-consumer
      - run: bun run build
      - uses: ./.github/actions/sdk-consumer
        with:
          project: example/client
      - run: bun run typecheck
        working-directory: example/client
      - run: bunx expo prebuild --platform ios --no-install
        working-directory: example/client
        env:
          CI: '1'
      - run: pod install
        working-directory: example/client/ios
      # Debug compiles the module's simulator runtime activation, which the example turns on.
      - name: Build the example for the iOS Simulator
        working-directory: example/client/ios
        run: xcodebuild -workspace CallKitTel.xcworkspace -scheme CallKitTel -configuration Debug -destination 'generic/platform=iOS Simulator' ARCHS=arm64 -derivedDataPath "$RUNNER_TEMP/v2-ios" CODE_SIGNING_ALLOWED=NO build
      - name: Verify embedded extension versions
        shell: bash
        run: |
          set -euo pipefail
          app="$RUNNER_TEMP/v2-ios/Build/Products/Debug-iphonesimulator/CallKitTel.app"
          for key in CFBundleVersion CFBundleShortVersionString; do
            app_version=$(/usr/libexec/PlistBuddy -c "Print :$key" "$app/Info.plist")
            test -n "$app_version"
            while IFS= read -r -d '' extension; do
              extension_version=$(/usr/libexec/PlistBuddy -c "Print :$key" "$extension/Info.plist")
              test -n "$extension_version"
              if [[ "$extension_version" != "$app_version" ]]; then
                echo "::error::$extension $key '$extension_version' differs from app '$app_version'"
                exit 1
              fi
            done < <(find "$app" -type d -name '*.appex' -print0)
          done
