name: v2 iOS

on:
  pull_request:
    branches: [v2]
    paths: ['ios/**', 'example/client/**', 'src/**', 'plugin/**', 'package.json', 'bun.lock', '.github/workflows/v2-ios.yml']
  push:
    branches: [v2]
    paths: ['ios/**', 'example/client/**', 'src/**', 'plugin/**', 'package.json', 'bun.lock', '.github/workflows/v2-ios.yml']

permissions:
  contents: read
concurrency:
  group: v2-ios-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  example:
    runs-on: xcode-27
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.0'
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      # ios-voip-sdk requires Swift 6.4.
      - run: sudo xcode-select -s /Applications/Xcode_27.1.app
      - run: bun install --frozen-lockfile
      - run: bun run build
      - run: bun install --frozen-lockfile
        working-directory: example/client
      - run: bun run typecheck
        working-directory: example/client
      - run: bunx expo prebuild --platform ios --no-install
        working-directory: example/client
        env:
          CI: '1'
      - run: pod install
        working-directory: example/client/ios
      # Debug compiles the module's simulator runtime activation, which the example turns on.
      - name: Build the example for the iOS Simulator
        working-directory: example/client/ios
        run: xcodebuild -workspace CallKitTel.xcworkspace -scheme CallKitTel -configuration Debug -destination 'generic/platform=iOS Simulator' ARCHS=arm64 -derivedDataPath "$RUNNER_TEMP/v2-ios" CODE_SIGNING_ALLOWED=NO build
