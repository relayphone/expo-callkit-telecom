name: SDK release package

on:
  workflow_call:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubicloud-standard-4
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '26'
      - name: Download and verify the SDK release asset
        run: node tools/sdk-evaluation.ts download-sdk "$RUNNER_TEMP/sdk-package"
      - uses: actions/upload-artifact@v6
        with:
          name: sdk-release-package
          path: ${{ runner.temp }}/sdk-package/*
          if-no-files-found: error
          retention-days: 7
      - name: Remove the temporary release archive
        if: always()
        run: rm -rf "$RUNNER_TEMP/sdk-package"
