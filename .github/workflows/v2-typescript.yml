name: v2 TypeScript

on:
  pull_request:
    branches: [v2]
    paths:
      - 'test/**'
      - 'tools/check-call-identity.mjs'
      - 'android/src/androidTest/assets/call-identity.json'
      - 'src/**'
      - 'plugin/**'
      - 'rfcs/**'
      - 'package.json'
      - 'bun.lock'
      - 'tsconfig*.json'
      - 'typedoc.json'
      - 'eslint.config.js'
      - '.github/workflows/v2-typescript.yml'
      - '.github/workflows/sdk-package.yml'
      - '.github/actions/sdk-consumer/**'
      - 'tools/sdk-evaluation*'
  push:
    branches: [v2]
    paths:
      - 'test/**'
      - 'tools/check-call-identity.mjs'
      - 'android/src/androidTest/assets/call-identity.json'
      - 'src/**'
      - 'plugin/**'
      - 'rfcs/**'
      - 'package.json'
      - 'bun.lock'
      - 'tsconfig*.json'
      - 'typedoc.json'
      - 'eslint.config.js'
      - '.github/workflows/v2-typescript.yml'
      - '.github/workflows/sdk-package.yml'
      - '.github/actions/sdk-consumer/**'
      - 'tools/sdk-evaluation*'

permissions:
  contents: read

concurrency:
  group: v2-typescript-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  sdk-package:
    uses: ./.github/workflows/sdk-package.yml
  typescript:
    needs: sdk-package
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.0'
      - uses: actions/setup-node@v6
        with:
          node-version: '26'
      - uses: ./.github/actions/sdk-consumer
      - run: node tools/check-call-identity.mjs
      - run: bun run build
      - run: bun run test:contracts
      - run: bun run typecheck
      - run: bun run lint
      - run: bun run test -- --runInBand
      - run: bun run docs:api
