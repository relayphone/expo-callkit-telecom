name: v2 Android

on:
  pull_request:
    branches: [v2]
    paths: ['tools/gradle-wrapper-timeout*', 'tools/sdk-evaluation*', '.github/actions/sdk-consumer/**', '.github/workflows/sdk-package.yml', 'android/**', 'src/**', 'plugin/**', 'example/client/**', 'package.json', 'bun.lock', 'test/**', 'tools/**native-media*', 'tools/*android-dnd*', 'tools/check-call-identity.mjs', 'tools/check-android-journey*', 'tools/check-answered-elsewhere*', '.github/workflows/v2-android.yml']
  push:
    branches: [v2]
    paths: ['tools/gradle-wrapper-timeout*', 'tools/sdk-evaluation*', '.github/actions/sdk-consumer/**', '.github/workflows/sdk-package.yml', 'android/**', 'src/**', 'plugin/**', 'example/client/**', 'package.json', 'bun.lock', 'test/**', 'tools/**native-media*', 'tools/*android-dnd*', 'tools/check-call-identity.mjs', 'tools/check-android-journey*', 'tools/check-answered-elsewhere*', '.github/workflows/v2-android.yml']

permissions:
  contents: read
concurrency:
  group: v2-android-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  sdk-package:
    uses: ./.github/workflows/sdk-package.yml
  emulator:
    needs: sdk-package
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '26'
      - run: node --test tools/run-native-media-journey.test.ts tools/native-media-fixture-log.test.ts tools/check-native-media.test.ts tools/check-android-journey.test.ts tools/check-answered-elsewhere.test.ts tools/check-android-dnd.test.ts
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.0'
      - uses: ./.github/actions/sdk-consumer
      - run: node node_modules/typescript/bin/tsc -p tsconfig.executor.json
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: tools/native-media-requirements.txt
      - name: Start native media fixture
        run: |
          timeout 180s pip install --disable-pip-version-check -r tools/native-media-requirements.txt
          timeout 180s bash tools/prepare-native-media-fixture.sh
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: |
            node tools/run-native-media-journey.ts
            bash tools/run-android-dnd.sh
      - name: Stop native media fixture
        if: always()
        run: |
          if [ -f "$RUNNER_TEMP/native-media-fixture/pid" ]; then kill "$(cat "$RUNNER_TEMP/native-media-fixture/pid")" || true; fi
          docker rm -f native-media-fixture || true
      - name: Retain sanitized native media fixture log
        if: always()
        run: node tools/native-media-fixture-log.ts "$RUNNER_TEMP/native-media-fixture" android/instrumentation/build/native-media-fixture.log
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: android-instrumentation-results
          path: |
            android/instrumentation/build/outputs/androidTest-results/**/*.xml
            android/instrumentation/build/journey-results.json
            android/instrumentation/build/answered-elsewhere-results.json
            android/instrumentation/build/native-media-results.json
            android/instrumentation/build/native-webrtc-results.json
            android/instrumentation/build/native-media-fixture.log
            android/instrumentation/build/dnd-results
          if-no-files-found: error

  native-bridge:
    needs: sdk-package
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.0'
      - uses: actions/setup-node@v6
        with:
          node-version: '26'
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - uses: ./.github/actions/sdk-consumer
      - run: bun run build
      - uses: ./.github/actions/sdk-consumer
        with:
          project: example/client
      - run: bunx expo prebuild --platform android --no-install
        working-directory: example/client
        env:
          CI: '1'
      - run: node tools/gradle-wrapper-timeout.ts example/client/android
      - run: ./gradlew :expo-callkit-telecom:compileDebugKotlin --no-daemon --max-workers=2 --stacktrace
        working-directory: example/client/android
      # The example leaves out the LiveKit media engine; compile the module with it as well.
      - run: ./gradlew :expo-callkit-telecom:compileDebugKotlin -Pexpo-callkit-telecom.androidNativeMedia=livekit --no-daemon --max-workers=2 --stacktrace
        working-directory: example/client/android
