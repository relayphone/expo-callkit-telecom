name: v2 Android

on:
  pull_request:
    branches: [v2]
    paths: ['android/**', 'src/**', 'plugin/**', 'example/client/**', 'package.json', 'bun.lock', 'test/**', 'tools/**native-media*', 'tools/summarize-native-latency.py', 'tools/*android-dnd*', 'tools/check-call-identity.mjs', 'tools/check-android-journey.py', '.github/workflows/v2-android.yml']
  push:
    branches: [v2]
    paths: ['android/**', 'src/**', 'plugin/**', 'example/client/**', 'package.json', 'bun.lock', 'test/**', 'tools/**native-media*', 'tools/summarize-native-latency.py', 'tools/*android-dnd*', 'tools/check-call-identity.mjs', 'tools/check-android-journey.py', '.github/workflows/v2-android.yml']

permissions:
  contents: read
concurrency:
  group: v2-android-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  emulator:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: tools/native-media-requirements.txt
      - name: Start native media fixture
        run: |
          timeout 180s pip install --disable-pip-version-check -r tools/native-media-requirements.txt
          timeout 180s bash tools/prepare-native-media-fixture.sh
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: |
            bash tools/run-native-media-journey.sh
            bash tools/run-android-dnd.sh
      - name: Stop native media fixture
        if: always()
        run: |
          if [ -f "$RUNNER_TEMP/native-media-fixture/pid" ]; then kill "$(cat "$RUNNER_TEMP/native-media-fixture/pid")" || true; fi
          docker rm -f native-media-fixture || true
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: android-instrumentation-results
          path: |
            android/instrumentation/build/outputs/androidTest-results/**/*.xml
            android/instrumentation/build/journey-results.json
            android/instrumentation/build/native-media-results.json
            android/instrumentation/build/native-webrtc-results.json
            android/instrumentation/build/native-latency-summary.json
            android/instrumentation/build/native-latency-summary.md
            android/instrumentation/build/dnd-results
          if-no-files-found: error

  native-bridge:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.0'
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - run: bun install --frozen-lockfile
      - run: bun run build
      - run: bun install --frozen-lockfile
        working-directory: example/client
      - run: bunx expo prebuild --platform android --no-install
        working-directory: example/client
        env:
          CI: '1'
      - run: ./gradlew :expo-callkit-telecom:compileDebugKotlin --no-daemon --max-workers=2 --stacktrace
        working-directory: example/client/android
