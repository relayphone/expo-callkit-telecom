name: v2 example

on:
  pull_request:
    branches: [v2]
    paths: ['tools/gradle-wrapper-timeout*', 'tools/sdk-evaluation*', '.github/actions/sdk-consumer/**', '.github/workflows/sdk-package.yml', 'src/**', 'android/**', 'plugin/**', 'example/client/**', 'package.json', 'bun.lock', 'tools/*example*', 'tools/android-emulator-executor*', 'tools/android-journey*', 'tools/package.json', 'tsconfig.executor.json', 'tsconfig.journeys*.json', '.github/workflows/v2-example.yml']
  push:
    branches: [v2]
    paths: ['tools/gradle-wrapper-timeout*', 'tools/sdk-evaluation*', '.github/actions/sdk-consumer/**', '.github/workflows/sdk-package.yml', 'src/**', 'android/**', 'plugin/**', 'example/client/**', 'package.json', 'bun.lock', 'tools/*example*', 'tools/android-emulator-executor*', 'tools/android-journey*', 'tools/package.json', 'tsconfig.executor.json', 'tsconfig.journeys*.json', '.github/workflows/v2-example.yml']

permissions:
  contents: read
concurrency:
  group: v2-example-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  sdk-package:
    uses: ./.github/workflows/sdk-package.yml
  build:
    needs: sdk-package
    runs-on: ubicloud-standard-4
    timeout-minutes: 30
    env:
      ANDROID_JOURNEY_PACKED: '1'
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.0'
      - uses: actions/setup-node@v6
        with:
          node-version: '26'
      - run: node --test tools/android-emulator-executor.test.ts tools/gradle-wrapper-timeout.test.ts tools/android-journey*.test.ts
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - uses: ./.github/actions/sdk-consumer
      - run: node_modules/.bin/tsc -p tsconfig.executor.json
      - run: bun run build
      - run: node node_modules/typescript/bin/tsc -p tsconfig.journeys.json
      - run: node node_modules/typescript/bin/tsc -p tsconfig.journeys-app.json
      - run: node tools/android-journey-project.ts package "$RUNNER_TEMP/journey-package"
      - uses: ./.github/actions/sdk-consumer
        with:
          project: example/client
          install-mode: temporary-fork
      - run: bun run typecheck
        working-directory: example/client
      - run: bunx expo prebuild --platform android --no-install
        working-directory: example/client
        env:
          CI: '1'
      - run: node tools/gradle-wrapper-timeout.ts example/client/android
      - run: node tools/android-journey-project.ts instrumentation example/client/android
      - run: ./gradlew :app:assembleRelease :app:assembleReleaseAndroidTest --no-daemon --max-workers=2 -PreactNativeArchitectures=x86_64 --stacktrace
        working-directory: example/client/android
      - run: node tools/android-journey-project.ts artifacts "$RUNNER_TEMP/journey-apks"
      - uses: actions/upload-artifact@v6
        with:
          name: v2-example-apk
          path: ${{ runner.temp }}/journey-apks/*.apk
          if-no-files-found: error
      - name: Delete the temporary package archive
        if: always()
        run: rm -rf "$RUNNER_TEMP/journey-package" "$RUNNER_TEMP/journey-apks"
  journey:
    needs: build
    runs-on: ubicloud-standard-4
    timeout-minutes: 15
    env:
      ANDROID_EXECUTOR_LABEL: ubicloud-standard-4
      ANDROID_EXECUTOR_REASON: Preferred Ubicloud executor; hardware acceleration is required.
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '26'
      - uses: actions/download-artifact@v6
        with:
          name: v2-example-apk
          path: example-apk
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Require a bounded executor with accessible KVM
        run: node tools/android-emulator-executor.ts preflight executor-results/preflight.json
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          profile: pixel_6
          cores: 2
          avd-name: example-journey
          emulator-boot-timeout: 300
          disable-linux-hw-accel: false
          disable-animations: true
          emulator-options: -accel on -cores 2 -no-snapshot -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: |
            node tools/android-emulator-executor.ts boot executor-results/boot.json
            bash tools/run-example-journey.sh
            node tools/android-journey.ts example-apk journey-results
      - name: Remove the temporary emulator
        if: always()
        run: |
          if [ -n "${ANDROID_AVD_HOME:-}" ]; then
            rm -rf "$ANDROID_AVD_HOME/example-journey.avd" "$ANDROID_AVD_HOME/example-journey.ini"
          fi
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: v2-example-journey
          path: |
            example-journey.json
            journey-results/*
            executor-results/*.json
          if-no-files-found: error
