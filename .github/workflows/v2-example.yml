name: v2 example

on:
  pull_request:
    branches: [v2]
    paths: ['src/**', 'android/**', 'plugin/**', 'example/client/**', 'package.json', 'bun.lock', 'tools/*example*', '.github/workflows/v2-example.yml']
  push:
    branches: [v2]
    paths: ['src/**', 'android/**', 'plugin/**', 'example/client/**', 'package.json', 'bun.lock', 'tools/*example*', '.github/workflows/v2-example.yml']

permissions:
  contents: read
concurrency:
  group: v2-example-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.0'
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - run: bun install --frozen-lockfile
      - run: bun run build
      - run: bun install --frozen-lockfile
        working-directory: example/client
      - run: bun run typecheck
        working-directory: example/client
      - run: bunx expo prebuild --platform android --no-install
        working-directory: example/client
        env:
          CI: '1'
      - run: ./gradlew :app:assembleRelease --no-daemon --max-workers=2 -PreactNativeArchitectures=x86_64 --stacktrace
        working-directory: example/client/android
      - uses: actions/upload-artifact@v6
        with:
          name: v2-example-apk
          path: example/client/android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
  journey:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v6
        with:
          name: v2-example-apk
          path: example-apk
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: bash tools/run-example-journey.sh
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: v2-example-journey
          path: example-journey.json
          if-no-files-found: error
