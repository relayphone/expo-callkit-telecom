name: v2 Android DND study

on:
  workflow_dispatch:
  pull_request:
    branches: [v2]
    paths:
      - 'android/src/main/**'
      - 'android/build.gradle'
      - 'android/gradle.properties'
      - 'android/instrumentation/build.gradle'
      - 'android/instrumentation/settings.gradle'
      - 'android/instrumentation/gradle.properties'
      - 'android/instrumentation/src/main/**'
      - 'android/instrumentation/src/androidTest/java/expo/modules/callkittelecom/conversations/DndStudyCaseTest.kt'
      - 'android/instrumentation/policy-helper/**'
      - 'tools/run-android-dnd-study.sh'
      - 'tools/check-android-dnd-study.py'
      - 'tools/aggregate-native-latency.py'
      - '.github/workflows/v2-android-dnd-study.yml'
  push:
    branches: [v2]
    paths:
      - 'android/src/main/**'
      - 'android/build.gradle'
      - 'android/gradle.properties'
      - 'android/instrumentation/build.gradle'
      - 'android/instrumentation/settings.gradle'
      - 'android/instrumentation/gradle.properties'
      - 'android/instrumentation/src/main/**'
      - 'android/instrumentation/src/androidTest/java/expo/modules/callkittelecom/conversations/DndStudyCaseTest.kt'
      - 'android/instrumentation/policy-helper/**'
      - 'tools/run-android-dnd-study.sh'
      - 'tools/check-android-dnd-study.py'
      - 'tools/aggregate-native-latency.py'
      - '.github/workflows/v2-android-dnd-study.yml'

permissions:
  contents: read
concurrency:
  group: v2-android-dnd-study-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  study:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        lane: [platform, native]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: bash tools/run-android-dnd-study.sh '${{ matrix.lane }}' '${{ github.run_id }}'
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: android-dnd-study-${{ matrix.lane }}
          path: android/instrumentation/build/dnd-study-results/${{ matrix.lane }}/*.json
          if-no-files-found: error
