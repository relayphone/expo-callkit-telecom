name: v2 SDK package evaluation

on:
  pull_request:
    branches: [v2]
    paths: &paths
      - 'src/**'
      - 'ios/**'
      - 'android/**'
      - 'plugin/**'
      - 'package.json'
      - 'bun.lock'
      - 'app.plugin.js'
      - 'expo-module.config.json'
      - '.npmignore'
      - 'tools/sdk-evaluation*'
      - 'tools/package.json'
      - 'tsconfig.sdk-evaluation.json'
      - '.github/workflows/v2-sdk-evaluation.yml'
  push:
    branches: [v2]
    paths: *paths
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: v2-sdk-evaluation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  sdk-package:
    runs-on: ubicloud-standard-4
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '26'
      - name: Read the pinned SDK revision
        id: sdk
        run: node tools/sdk-evaluation.ts revision >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v6
        with:
          repository: relayphone/ios-voip-sdk
          ref: ${{ steps.sdk.outputs.revision }}
          path: sdk-source
          persist-credentials: false
      - name: Pack the SDK with its normal prepack hook
        run: node tools/sdk-evaluation.ts pack-sdk sdk-source "$RUNNER_TEMP/sdk-package"
      - uses: actions/upload-artifact@v6
        with:
          name: sdk-evaluation-package
          path: ${{ runner.temp }}/sdk-package/*
          if-no-files-found: error
          retention-days: 7
      - name: Delete the temporary SDK checkout and package
        if: always()
        run: rm -rf "$GITHUB_WORKSPACE/sdk-source" "$RUNNER_TEMP/sdk-package"

  consumer:
    needs: sdk-package
    runs-on: ubicloud-standard-4
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '26'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.0'
      - uses: actions/download-artifact@v6
        with:
          name: sdk-evaluation-package
          path: ${{ runner.temp }}/sdk-package
      - run: bun install --frozen-lockfile
      - name: Verify host tooling
        run: |
          node --test tools/sdk-evaluation.test.ts
          node node_modules/typescript/bin/tsc -p tsconfig.sdk-evaluation.json
      - run: npm run build
      - name: Install and check both tarballs in an isolated consumer
        run: node tools/sdk-evaluation.ts check-consumer "$RUNNER_TEMP/sdk-package" "$GITHUB_WORKSPACE" "$RUNNER_TEMP/package-consumer"
      - name: Record evaluation provenance
        if: always()
        run: |
          if [ -f "$RUNNER_TEMP/sdk-package/sdk-artifact.json" ]; then
            cat "$RUNNER_TEMP/sdk-package/sdk-artifact.json" >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Delete the temporary consumer and package
        if: always()
        run: rm -rf "$RUNNER_TEMP/package-consumer" "$RUNNER_TEMP/sdk-package"
