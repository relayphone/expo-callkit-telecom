name: v2 SDK package evaluation

on:
  pull_request:
    branches: [v2]
    paths: &paths
      - 'src/**'
      - 'ios/**'
      - 'android/**'
      - 'plugin/**'
      - 'package.json'
      - 'bun.lock'
      - 'app.plugin.js'
      - 'expo-module.config.json'
      - '.npmignore'
      - 'tools/sdk-evaluation*'
      - 'test/fixtures/**'
      - '.github/actions/sdk-consumer/**'
      - '.github/workflows/sdk-package.yml'
      - 'tools/package.json'
      - 'tsconfig.sdk-evaluation.json'
      - '.github/workflows/v2-sdk-evaluation.yml'
  push:
    branches: [v2]
    paths: *paths
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: v2-sdk-evaluation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  sdk-package:
    uses: ./.github/workflows/sdk-package.yml

  consumer:
    needs: sdk-package
    runs-on: ubicloud-standard-4
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '26'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.0'
      - uses: ./.github/actions/sdk-consumer
      - name: Verify host tooling
        run: |
          node --test tools/sdk-evaluation.test.ts
          node node_modules/typescript/bin/tsc -p tsconfig.sdk-evaluation.json
      - run: npm run build
      - name: Install the fork tarball with the SDK release URL in an isolated consumer
        run: node tools/sdk-evaluation.ts check-consumer "$RUNNER_TEMP/sdk-package" "$GITHUB_WORKSPACE" "$RUNNER_TEMP/package-consumer"
      - name: Record evaluation provenance
        if: always()
        run: |
          if [ -f "$RUNNER_TEMP/sdk-package/SHA256SUMS" ]; then
            cat "$RUNNER_TEMP/sdk-package/SHA256SUMS" >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Delete the temporary consumer and package
        if: always()
        run: rm -rf "$RUNNER_TEMP/package-consumer" "$RUNNER_TEMP/sdk-package"

  ios-consumer:
    needs: sdk-package
    runs-on: xcode-27
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '26'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.0'
      - run: sudo xcode-select -s /Applications/Xcode_27.1.app
      - uses: ./.github/actions/sdk-consumer
      - run: npm run build
      - name: Prepare the isolated packed iOS consumer
        run: node tools/sdk-evaluation.ts ios-consumer "$RUNNER_TEMP/sdk-package" "$GITHUB_WORKSPACE" "$RUNNER_TEMP/ios-consumer"
      - run: npx expo prebuild --platform ios --no-install
        working-directory: ${{ runner.temp }}/ios-consumer
        env:
          CI: '1'
      - run: pod install
        working-directory: ${{ runner.temp }}/ios-consumer/ios
      - name: Build the SDK composition consumer
        working-directory: ${{ runner.temp }}/ios-consumer/ios
        run: xcodebuild -workspace SDKComposition.xcworkspace -scheme SDKComposition -configuration Debug -destination 'generic/platform=iOS Simulator' ARCHS=arm64 -derivedDataPath "$RUNNER_TEMP/sdk-composition-build" CODE_SIGNING_ALLOWED=NO build
      - name: Remove temporary consumer and build products
        if: always()
        run: rm -rf "$RUNNER_TEMP/ios-consumer" "$RUNNER_TEMP/sdk-composition-build" "$RUNNER_TEMP/sdk-package"
