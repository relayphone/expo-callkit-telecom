plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'expo.modules.callkittelecom'
version = '0.1.0'

// Only the Android native provider option selects the media engine.
def androidNativeMedia = findProperty('expo-callkit-telecom.androidNativeMedia') ?: 'none'
if (!(androidNativeMedia in ['livekit', 'none'])) {
  throw new GradleException("ExpoCallKitTelecom: androidNativeMedia must be livekit or none.")
}
def nativeMediaEngine = androidNativeMedia == 'livekit'

// Expo autolinking knows whether notifications is a source project or a prebuilt artifact.
def notificationsDependency = rootProject.findProject(':expo-notifications')
if (notificationsDependency == null) {
  def autolinking = gradle.extensions.findByName('expoGradle')
  if (autolinking?.config?.allProjects?.any { it.name == 'expo-notifications' }) {
    notificationsDependency = expoModule.getExpoDependency('expo-notifications')
  }
}

android {
  namespace "expo.modules.callkittelecom"
  defaultConfig {
    versionCode 1
    versionName "0.1.0"
  }
  lintOptions {
    abortOnError false
  }
  sourceSets {
    main.java.srcDir(nativeMediaEngine ? 'src/livekit/java' : 'src/withoutLivekit/java')
    if (notificationsDependency != null) {
      main.java.srcDir('src/main/notifications')
    }
  }
}

if (nativeMediaEngine) {
  repositories {
    maven { url "https://jitpack.io"; content { includeGroup "com.github.davidliu" } }
  }
}

dependencies {
  if (nativeMediaEngine) {
    implementation "io.livekit:livekit-android:2.29.2"
  }
  compileOnly "com.facebook.react:react-android"
  implementation "androidx.core:core-telecom:1.0.1"
  implementation "org.jetbrains.kotlinx:kotlinx-coroutines-android:1.10.2"
  implementation "com.google.firebase:firebase-messaging:24.1.0"

  if (notificationsDependency != null) {
    compileOnly notificationsDependency
  }
}
