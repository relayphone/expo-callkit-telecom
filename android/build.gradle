plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'expo.modules.callkittelecom'
version = '0.1.0'

// The config plugin writes the mediaAdapter option to gradle.properties; regenerate the Android
// project after changing it. "livekit" adds the native media engine: livekit-android, its WebRTC
// build and JitPack repository, and OkHttp for the built-in HTTPS credentials fetcher.
def mediaAdapter = findProperty('expo-callkit-telecom.mediaAdapter') ?: 'webrtc'
if (!(mediaAdapter in ['webrtc', 'livekit', 'none'])) {
  throw new GradleException("ExpoCallKitTelecom: expo-callkit-telecom.mediaAdapter must be webrtc, livekit or none.")
}
def nativeMediaEngine = mediaAdapter == 'livekit'

android {
  namespace "expo.modules.callkittelecom"
  defaultConfig {
    versionCode 1
    versionName "0.1.0"
  }
  lintOptions {
    abortOnError false
  }
  sourceSets {
    main.java.srcDir(nativeMediaEngine ? 'src/livekit/java' : 'src/withoutLivekit/java')
  }
}

if (nativeMediaEngine) {
  repositories {
    maven { url "https://jitpack.io"; content { includeGroup "com.github.davidliu" } }
  }
}

dependencies {
  if (nativeMediaEngine) {
    implementation "io.livekit:livekit-android:2.29.2"
    implementation "com.squareup.okhttp3:okhttp:4.12.0"
  }
  compileOnly "com.facebook.react:react-android"
  implementation "androidx.core:core-telecom:1.0.1"
  implementation "org.jetbrains.kotlinx:kotlinx-coroutines-android:1.10.2"
  implementation "com.google.firebase:firebase-messaging:24.1.0"

  // expo-notifications may be included as a source project or as a prebuilt
  // Maven artifact via Expo's version catalog, depending on the SDK version.
  def notificationsProject = rootProject.findProject(":expo-notifications")
  if (notificationsProject != null) {
    compileOnly notificationsProject
  } else {
    compileOnly "host.exp.exponent:expo.modules.notifications:+"
  }
}
