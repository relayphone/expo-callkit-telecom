plugins {
  id 'com.android.application' version '8.9.2'
  id 'org.jetbrains.kotlin.android' version '2.1.20'
}

android {
  namespace 'expo.modules.callkittelecom.instrumentation'
  compileSdk 35
  compileOptions {
    sourceCompatibility JavaVersion.VERSION_17
    targetCompatibility JavaVersion.VERSION_17
  }
  defaultConfig {
    applicationId 'expo.modules.callkittelecom.instrumentation'
    minSdk 26
    targetSdk 35
    testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
  }
  sourceSets {
    main.java.srcDirs = ['../src/main/java/expo/modules/callkittelecom/conversations']
    androidTest.assets.srcDirs = ['../src/androidTest/assets']
  }
}

kotlin { jvmToolchain(17) }

dependencies {
  implementation "androidx.core:core-telecom:1.0.1"
  implementation "androidx.core:core-ktx:1.15.0"
  implementation "org.jetbrains.kotlinx:kotlinx-coroutines-android:1.10.2"
  androidTestImplementation 'androidx.test:runner:1.6.2'
  androidTestImplementation 'androidx.test:rules:1.6.1'
  androidTestImplementation 'androidx.test.ext:junit:1.2.1'
}
